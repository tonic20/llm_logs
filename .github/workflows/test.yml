name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        ruby: ["3.3", "4.0"]
        database: [postgresql, sqlite]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: llm_logs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llm_logs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      LLM_LOGS_DATABASE: ${{ matrix.database }}
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Create database
        if: matrix.database == 'postgresql'
        run: >-
          DATABASE_URL=postgresql://$PGUSER:$PGPASSWORD@$PGHOST:5432/llm_logs_test
          bundle exec rake db:create

      - name: Run migrations
        if: matrix.database == 'postgresql'
        run: >-
          DATABASE_URL=postgresql://$PGUSER:$PGPASSWORD@$PGHOST:5432/llm_logs_test
          bundle exec rake db:migrate

      - name: Run test suite
        run: bundle exec rspec
